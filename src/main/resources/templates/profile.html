<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>

<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <!-- Main Content -->
        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Profile</h2>
                    <p class="text-muted mb-0">View your account information.</p>
                </div>

                <a th:href="@{/dashboard}"
                   class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Dashboard
                </a>
            </div>

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="card">

                        <div class="card-header bg-white">
                            <i class="bi bi-person-circle me-1"></i>
                            User Profile
                        </div>

                        <div class="card-body">

                            <div class="text-center mb-4">

                                <div class="mb-3">
                                    <i class="bi bi-person-circle text-primary"
                                       style="font-size: 5rem;">
                                    </i>
                                </div>

                                <h4 class="mb-1"
                                    th:text="${#authentication.name}">
                                    Admin
                                </h4>

                                <p class="text-muted mb-0">
                                    Administrator
                                </p>

                            </div>

                            <hr>

                            <div class="row mb-3">

                                <div class="col-md-4 fw-semibold">
                                    Username
                                </div>

                                <div class="col-md-8"
                                     th:text="${#authentication.name}">
                                    Admin
                                </div>

                            </div>

                            <div class="row mb-3">

                                <div class="col-md-4 fw-semibold">
                                    Role
                                </div>

                                <div class="col-md-8">
                                    <span class="badge bg-primary">
                                        ADMIN
                                    </span>
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-4 fw-semibold">
                                    Account Status
                                </div>

                                <div class="col-md-8">
                                    <span class="badge bg-success">
                                        Active
                                    </span>
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Footer -->
        <footer class="py-4 bg-light mt-auto border-top">

            <div class="container-fluid px-4">

                <div class="d-flex align-items-center justify-content-between small">

                    <div class="text-muted">
                        Copyright &copy; Student Management System 2026
                    </div>

                    <div>
                        <a href="#">Privacy Policy</a>
                        &middot;
                        <a href="#">Terms &amp; Conditions</a>
                    </div>

                </div>

            </div>

        </footer>

    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
