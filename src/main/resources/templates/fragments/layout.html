<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Application CSS -->
    <link th:href="@{/css/style.css}"
          rel="stylesheet">

</head>


<body>


<!-- =========================================================
     SIDEBAR
     ========================================================= -->

<div th:fragment="sidebar"
     id="sidebar-wrapper"
     class="bg-dark text-white">

    <!-- Logo / Heading -->
    <div class="sidebar-heading border-bottom border-secondary">

        <i class="bi bi-mortarboard-fill me-2"></i>

        SMS Admin

    </div>


    <!-- Navigation -->
    <div class="list-group list-group-flush">


        <!-- Dashboard -->

        <a th:href="@{/dashboard}"
           class="sidebar-link"
           data-path="/dashboard">

            <i class="bi bi-speedometer2"></i>

            <span>Dashboard</span>

        </a>


        <!-- Courses -->

        <a th:href="@{/course/list}"
           class="sidebar-link"
           data-path="/course">

            <i class="bi bi-book"></i>

            <span>Courses</span>

        </a>


        <!-- Students -->

        <a th:href="@{/students/list}"
           class="sidebar-link"
           data-path="/students">

            <i class="bi bi-people"></i>

            <span>Students</span>

        </a>


        <!-- Enrolled Students -->

        <a th:href="@{/enrollments/enrollmentList}"
           class="sidebar-link"
           data-path="/enrollments/enrollmentList">

            <i class="bi bi-check2-square"></i>

            <span>Enrolled Students</span>

        </a>


        <!-- Enroll Student -->

        <a th:href="@{/enrollments/showEnroll}"
           class="sidebar-link"
           data-path="/enrollments/showEnroll">

            <i class="bi bi-person-plus"></i>

            <span>Enroll to Course</span>

        </a>


        <!-- Logout -->

        <form th:action="@{/logout}"
              method="post"
              class="mt-3 border-top border-secondary">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    class="sidebar-link w-100 border-0 bg-transparent text-start">

                <i class="bi bi-box-arrow-right"></i>

                <span>Logout</span>

            </button>

        </form>

    </div>

</div>



<!-- =========================================================
     NAVBAR
     ========================================================= -->

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-light bg-light border-bottom">

    <div class="container-fluid">


        <!-- Sidebar Toggle -->

        <button class="btn btn-outline-secondary"
                id="sidebarToggle"
                type="button">

            <i class="bi bi-list"></i>

        </button>


        <!-- Mobile Navbar Toggle -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navbar Content -->

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">


            <ul class="navbar-nav ms-auto align-items-center">


                <!-- User Dropdown -->

                <li class="nav-item dropdown">


                    <a class="nav-link dropdown-toggle d-flex align-items-center"
                       href="#"
                       id="navbarDropdown"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        <i class="bi bi-person-circle fs-5 me-2"></i>

                        <span th:text="${#authentication.name}">
                            Admin
                        </span>

                    </a>


                    <!-- Dropdown Menu -->

                    <ul class="dropdown-menu dropdown-menu-end"
                        aria-labelledby="navbarDropdown">


                        <!-- Profile -->

                        <li>

                            <a class="dropdown-item"
                               th:href="@{/profile}">

                                <i class="bi bi-person me-2"></i>

                                Profile

                            </a>

                        </li>


                        <!-- Settings -->

                        <li>

                            <a class="dropdown-item"
                               th:href="@{/settings}">

                                <i class="bi bi-gear me-2"></i>

                                Settings

                            </a>

                        </li>


                        <!-- Divider -->

                        <li>

                            <hr class="dropdown-divider">

                        </li>


                        <!-- Logout -->

                        <li>

                            <form th:action="@{/logout}"
                                  method="post"
                                  class="m-0">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">


                                <button type="submit"
                                        class="dropdown-item text-danger">

                                    <i class="bi bi-box-arrow-right me-2"></i>

                                    Logout

                                </button>

                            </form>

                        </li>

                    </ul>

                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer th:fragment="footer"
        class="py-4 bg-light mt-auto border-top">

    <div class="container-fluid px-4">

        <div class="d-flex align-items-center justify-content-between small">


            <div class="text-muted">

                Copyright &copy; Student Management System 2026

            </div>


            <div>

                <a href="#">Privacy Policy</a>

                <span class="mx-1">&middot;</span>

                <a href="#">Terms &amp; Conditions</a>

            </div>

        </div>

    </div>

</footer>



<!-- =========================================================
     SCRIPTS
     ========================================================= -->

<th:block th:fragment="scripts">


    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- Sidebar Toggle -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const sidebarToggle =
                document.getElementById("sidebarToggle");

            if (sidebarToggle) {

                sidebarToggle.addEventListener("click", function (event) {

                    event.preventDefault();

                    document.body.classList.toggle(
                        "sb-sidenav-toggled"
                    );

                });

            }

        });

    </script>



    <!-- Active Sidebar Menu -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const currentPath =
                window.location.pathname;

            const sidebarLinks =
                document.querySelectorAll(
                    ".sidebar-link[data-path]"
                );


            sidebarLinks.forEach(function (link) {

                const path =
                    link.getAttribute("data-path");


                if (currentPath === path) {

                    link.classList.add("active");

                }

            });

        });

    </script>



    <!-- Dark Mode -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            if (localStorage.getItem("darkMode") === "true") {

                document.body.classList.add("dark-mode");

            }

        });

    </script>


</th:block>


</body>

</html>
